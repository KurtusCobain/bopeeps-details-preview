name: Site CI

on:
  push:
    branches:
      - dev/site-cleanup-phone-audit
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Python regression suite
        run: pytest -q

      - name: Validate JavaScript syntax
        run: node --check script-v3.js
