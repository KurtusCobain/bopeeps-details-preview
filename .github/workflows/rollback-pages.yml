name: Emergency rollback to pre-release site

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROLLBACK to restore the pre-release production snapshot'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm == 'ROLLBACK' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out preserved production snapshot
        uses: actions/checkout@v4
        with:
          ref: rollback/pre-release-2026-08-14

      - name: Build rollback site
        run: |
          mkdir _site

          cp .nojekyll _site/
          cp CNAME _site/
          cp index.html _site/
          cp services.html _site/
          cp policies.html _site/
          cp privacy.html _site/
          cp 404.html _site/
          cp auto-detailing-*.html _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp styles-v3.css _site/
          cp seo-pages.css _site/
          cp script-v3.js _site/
          cp favicon.ico _site/
          cp favicon-48.png _site/
          cp apple-touch-icon.png _site/

          cp -R assets _site/
          cp -R assets-v3 _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preserved production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy preserved production snapshot
        id: deployment
        uses: actions/deploy-pages@v4
