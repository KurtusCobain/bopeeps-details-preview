name: Apply customer copy polish

on:
  push:
    branches:
      - dev/customer-copy-audit
    paths:
      - 'scripts/apply_customer_copy_final_polish.py'
      - '.github/workflows/apply-customer-copy-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out customer copy branch
        uses: actions/checkout@v4
        with:
          ref: dev/customer-copy-audit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply current customer copy polish
        run: python scripts/apply_customer_copy_final_polish.py

      - name: Run full regression suite
        run: pytest -q

      - name: Validate JavaScript syntax
        run: node --check script-v3.js

      - name: Commit verified customer copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html policies.html privacy.html 404.html auto-detailing-*.html tests/test_local_seo_expansion.py
          if git diff --cached --quiet; then
            echo "Customer copy is already up to date."
          else
            git commit -m "test: persist customer copy regression updates"
            git push origin HEAD:dev/customer-copy-audit
          fi
